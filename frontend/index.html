<!doctype html>
<html lang="ru">
  <head>
    <!--opendeck-version:6350a72-->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      (function(){
        try {
          var params = new URLSearchParams(window.location.search);
          var urlVer = params.get('v');
          var m = new RegExp('<!--' + 'opendeck-version:([0-9a-zA-Z_-]+)-->').exec(document.documentElement.outerHTML);
          var htmlVer = m ? m[1] : '';
          var activeVer = urlVer || htmlVer;
          var key = 'opendeck_app_version';
          var stored = localStorage.getItem(key);

          if (activeVer && stored && stored !== activeVer) {
            localStorage.setItem(key, activeVer);
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
            window.location.reload();
            return;
          }
          if (activeVer) {
            localStorage.setItem(key, activeVer);
          }
        } catch(e){}
      })();
    </script>
    <!-- Telegram bridge MUST load before the app bundle (per tma-scaffold) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Open Deck — DJ School</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

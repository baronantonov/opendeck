      (function(){

          if(!m) return;
          const v = m[1];
          const key = 'opendeck_app_version';
          if(localStorage.getItem(key) && localStorage.getItem(key) !== v){
            localStorage.setItem(key, v);
            location.reload(true);
            return;
          }
          localStorage.setItem(key, v);
        } catch(e){}
      })();
